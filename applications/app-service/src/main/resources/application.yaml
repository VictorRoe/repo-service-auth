server:
  port: 8080
spring:
  application:
    name: "Authentication"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
  r2dbc:
    host: ${DB_HOST:postgres-db}
    port: 5432
    database: ${DB_NAME:auth_db}
    schema: ${DB_SCHEMA:public}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:12345}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600

logging:
  level:
    org.springframework.security: DEBUG