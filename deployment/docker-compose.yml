services:

  auth-db:
    image: postgres:16-alpine
    container_name: authentication-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${AUTH_DB_PASSWORD}
      - POSTGRES_DB=auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    image: auth-service
    container_name: auth-container
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=auth-db
      - DB_NAME=auth_db
      - DB_USERNAME=admin
      - DB_PASSWORD=${AUTH_DB_PASSWORD}
      - DB_SCHEMA=public
      - DB_PORT=${DB_PORT}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      auth-db:
        condition: service_healthy

volumes:
  postgres_data:
    external: true
